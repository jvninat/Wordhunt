<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duduy Word Hunt</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff3f3;
      color: #444;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      color: #d32f2f;
    }
    canvas {
      margin: 20px auto;
      border: 2px solid #e91e63;
      display: block;
    }
    .word-list {
      margin-top: 20px;
      font-size: 1.1em;
    }
    .word-list span {
      background-color: #ffebee;
      padding: 5px 10px;
      border-radius: 5px;
      margin: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>🔍 Duduy Word Hunt</h1>
  <p>Find the words hidden in the grid! Each one is a little piece of our love 😘</p>
  <canvas id="puzzle" width="400" height="400"></canvas>
  <div class="word-list">
  
  </div>
  <script>
    const canvas = document.getElementById('puzzle');
    const ctx = canvas.getContext('2d');
    const size = 10;
    const cell = 40;
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const words = ["PALAGI", "PAHINGA", "BOOBS", "JIBI", "CROCHET", "ARMPIT", "DUDUY", "NATNAT"];
    let grid = Array(size).fill().map(() => Array(size).fill(''));

    function fillGrid() {
      words.forEach(word => {
        let placed = false;
        while (!placed) {
          const dir = Math.random() < 0.5 ? 'H' : 'V';
          let row = Math.floor(Math.random() * size);
          let col = Math.floor(Math.random() * size);

          if (dir === 'H' && col + word.length <= size) {
            let canPlace = true;
            for (let i = 0; i < word.length; i++) {
              if (grid[row][col + i] && grid[row][col + i] !== word[i]) {
                canPlace = false;
                break;
              }
            }
            if (canPlace) {
              for (let i = 0; i < word.length; i++) {
                grid[row][col + i] = word[i];
              }
              placed = true;
            }
          } else if (dir === 'V' && row + word.length <= size) {
            let canPlace = true;
            for (let i = 0; i < word.length; i++) {
              if (grid[row + i][col] && grid[row + i][col] !== word[i]) {
                canPlace = false;
                break;
              }
            }
            if (canPlace) {
              for (let i = 0; i < word.length; i++) {
                grid[row + i][col] = word[i];
              }
              placed = true;
            }
          }
        }
      });

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!grid[r][c]) {
            grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
          }
        }
      }
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '20px Segoe UI';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          ctx.strokeStyle = '#ccc';
          ctx.strokeRect(c * cell, r * cell, cell, cell);
          ctx.fillText(grid[r][c], c * cell + cell / 2, r * cell + cell / 2);
        }
      }
    }

    fillGrid();
    drawGrid();
  </script>
</body>
</html>
